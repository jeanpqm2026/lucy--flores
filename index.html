<title>Para Lucy 💛</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#02020b;
  color:white;
}

/* GALAXIA */

#galaxia{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(255,210,70,.20) 0%,
      rgba(255,160,30,.08) 12%,
      transparent 30%),
    radial-gradient(circle at 30% 30%,
      rgba(100,70,255,.18),
      transparent 35%),
    radial-gradient(circle at 75% 70%,
      rgba(255,180,40,.15),
      transparent 35%),
    #02020b;
  transition:opacity 1.5s;
}

/* estrellas */

.estrella{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  animation:brillar 2s infinite alternate;
}

@keyframes brillar{
  from{
    opacity:.2;
    transform:scale(.7);
  }
  to{
    opacity:1;
    transform:scale(1.7);
  }
}

/* agujero negro */

.agujero{
  position:absolute;
  width:230px;
  height:230px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;

  background:#000;

  box-shadow:
    0 0 25px 8px rgba(255,190,40,.5),
    0 0 60px 20px rgba(255,140,20,.25),
    0 0 110px 40px rgba(100,60,255,.15);

  animation:latido 4s infinite ease-in-out;
}

@keyframes latido{
  0%,100%{
    transform:translate(-50%,-50%) scale(1);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.06);
  }
}

/* flores orbitando */

.orbita{
  position:absolute;
  width:340px;
  height:340px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  animation:girar 14s linear infinite;
}

.flor{
  position:absolute;
  font-size:42px;
}

.f1{
  top:-10px;
  left:50%;
}

.f2{
  right:0;
  top:50%;
}

.f3{
  bottom:-10px;
  left:50%;
}

.f4{
  left:0;
  top:50%;
}

@keyframes girar{
  to{
    transform:translate(-50%,-50%) rotate(360deg);
  }
}

  display:flex;

  justify
