
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Lucy 💛</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  overflow:hidden;
  background:linear-gradient(135deg,#fff8c9,#ffd86b);
}

.card{
  width:85%;
  max-width:400px;
  padding:30px 20px;
  text-align:center;
  background:white;
  border-radius:25px;
  box-shadow:0 15px 40px rgba(120,80,0,.25);
  animation:entrada 1.5s ease;
}

h1{
  color:#d99a00;
  font-size:35px;
}

.mensaje{
  color:#654f16;
  font-size:18px;
  line-height:1.5;
}

.flores{
  font-size:80px;
  margin:20px 0;
  animation:flotar 2s infinite ease-in-out;
}

.nota{
  display:inline-block;
  padding:10px 20px;
  background:#fff8cf;
  border-radius:15px;
  color:#c58b00;
  font-weight:bold;
  letter-spacing:2px;
}

.final{
  margin-top:20px;
  color:#a07b20;
}

.caida{
  position:fixed;
  top:-30px;
  animation:caer 6s linear forwards;
}

@keyframes entrada{
  from{
    opacity:0;
    transform:scale(.7);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes flotar{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

@keyframes caer{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="card">

<h1>Para Lucy 💛</h1>

<div class="flores">
🌻🌻🌻
</div>

<div class="nota">
LUCY 💛
</div>

<p class="mensaje">
Gracias por estar, por tu buena vibra y por hacer la vida más bonita con tu amistad.
<br><br>
¡Eres increíble! 🌻
</p>

<div class="final">
Un detalle de amistad para ti 💛
</div>

</div>

<script>
const simbolos=["🌻","💛","✨","🌼"];

function caer(){
  const x=document.createElement("div");
  x.className="caida";
  x.textContent=simbolos[Math.floor(Math.random()*simbolos.length)];
  x.style.left=Math.random()*100+"vw";
  x.style.fontSize=(15+Math.random()*20)+"px";
  document.body.appendChild(x);
  setTimeout(()=>x.remove(),6000);
}

setInterval(caer,500);
</script>

</body>
</html>
